name: bank-credit

x-backend: &backend
  image: bank-credit-api:local
  build: ./backend
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (at least 32 characters, see .env.example)}
    DEMO_PASSWORD: ${DEMO_PASSWORD:?set DEMO_PASSWORD in .env}

services:
  postgres:
    image: postgres:17-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    # Loopback only, so `make test-integration` can reach it; the other services use the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *backend
    command: ["sh", "-c", "bank-credit seed && bank-credit simulate --seed 42"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *backend
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    image: bank-credit-web:local
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
