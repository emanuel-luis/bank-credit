[project]
name = "bank-credit"
version = "0.1.0"
description = "FastAPI backend for bank credit requests: staged workflow, SLAs and an append-only event log."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "faker>=40",
    "fastapi>=0.162",
    "fastapi-mail>=1.6",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.3",
    "pydantic-settings>=2.16",
    "pydantic[email]>=2.14",
    "pyjwt>=2.15",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bank_credit"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.4",
    "ruff>=0.17",
]

[project.scripts]
bank-credit = "bank_credit.app.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["BLE", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
markers = ["integration: needs a real Postgres (TEST_DATABASE_URL); excluded by default"]
testpaths = ["tests"]
timeout = 60
