version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        # Majors arrive as their own PRs so breaking upgrades get a separate review.
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        # Majors arrive as their own PRs so breaking upgrades get a separate review.
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        # Majors arrive as their own PRs so breaking upgrades get a separate review.
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
        # Majors arrive as their own PRs so breaking upgrades get a separate review.
        update-types: ["minor", "patch"]
