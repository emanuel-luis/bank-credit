version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        # Majors arrive as their own PRs so breaking upgrades get a separate review.
        update-types: ["minor", "patch"]

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        # Majors arrive as their own PRs so breaking upgrades get a separate review.
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        # Majors arrive as their own PRs so breaking upgrades get a separate review.
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    ignore:
      # The runtime stays on Python 3.12 (decision 8); only digest and patch updates of that tag.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The Node major of the build stage moves by hand, to an LTS line only and together with
      # CI's setup-node (decision 62); digest updates of the current tag still come.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
        # Majors arrive as their own PRs so breaking upgrades get a separate review.
        update-types: ["minor", "patch"]
